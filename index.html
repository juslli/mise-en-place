<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mise en Place</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍳 Minhas Receitas</h1>
  </header>

  <main>
    <form id="recipe-form">
      <h2 id="form-title">Nova receita</h2>
      <input type="text" id="name" placeholder="Nome da receita" required>
      <input type="url" id="image" placeholder="Link da foto (opcional)">
      <textarea id="ingredients" placeholder="Ingredientes (um por linha)" rows="4" required></textarea>
      <textarea id="steps" placeholder="Modo de preparo" rows="4" required></textarea>
      <button type="submit" id="submit-btn">Salvar receita</button>
      <button type="button" id="cancel-btn" class="cancel" hidden>Cancelar edição</button>
    </form>

    <section>
      <h2>Receitas salvas</h2>
      <input type="search" id="search" class="search" placeholder="🔍 Buscar por nome ou ingrediente">
      <div id="recipe-list" class="grid"></div>
    </section>

    <section class="backup">
      <h2>Backup</h2>
      <p>Suas receitas ficam salvas neste aparelho. Exporte um arquivo para guardar ou levar para outro aparelho.</p>
      <div class="backup-actions">
        <button type="button" id="export-btn">⬇️ Exportar receitas</button>
        <button type="button" id="import-btn" class="secondary">⬆️ Importar receitas</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
